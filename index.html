<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ninjas vs Zombies</title>
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #eee;
      overflow: hidden;
    }
    canvas {
      background: #151515;
      border: 2px solid #333;
      box-shadow: 0 0 50px rgba(0,0,0,0.7);
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000;
      font-weight: 500;
    }
    #ui div { margin-bottom: 6px; font-size: 18px; }
    #highscore { color: #f1c40f; }
    #buffs { color: #2ecc71; font-size: 14px; }
    #weapon { color: #f39c12; }
    #stamina { color: #3498db; }
    #gameover {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.82);
      text-align: center;
    }
    #gameover h1 { color: #e74c3c; margin: 0 0 16px; font-size: 48px; }
    #gameover .stats { font-size: 20px; margin: 4px 0; }
    button {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 18px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #e74c3c; }
    #start {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.75);
      text-align: center;
    }
    #start h1 { color: #3498db; font-size: 42px; margin-bottom: 8px; }
    #start p { font-size: 18px; color: #aaa; margin: 4px 0; }
  </style>
</head>
<body>
  <canvas id="game" width="900" height="600"></canvas>
  <div id="ui">
    <div>Health: <span id="health">100</span></div>
    <div>Score: <span id="score">0</span></div>
    <div>Wave: <span id="wave">1</span></div>
    <div>Kills: <span id="kills">0</span></div>
    <div id="highscore">High: <span id="high">0</span></div>
    <div id="weapon">Weapon: Shuriken (1)</div>
    <div id="stamina">Stamina: 100</div>
    <div id="buffs"></div>
  </div>
  <div id="start">
    <h1>NINJAS VS ZOMBIES</h1>
    <p>WASD / Arrows to move • Shift to dash</p>
    <p>Mouse to aim • Left Click to attack</p>
    <p>1-4 to switch weapons</p>
    <p>Walk over glowing orbs for power-ups</p>
    <button onclick="startGame()">Start Run</button>
  </div>
  <div id="gameover">
    <h1>YOU DIED</h1>
    <div class="stats">Score: <span id="finalScore">0</span></div>
    <div class="stats">Wave: <span id="finalWave">1</span></div>
    <div class="stats">Kills: <span id="finalKills">0</span></div>
    <div class="stats" id="newHigh" style="color:#f1c40f;display:none;">New High Score!</div>
    <button onclick="restart()">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ui = {
      health: document.getElementById('health'),
      score: document.getElementById('score'),
      wave: document.getElementById('wave'),
      kills: document.getElementById('kills'),
      high: document.getElementById('high'),
      weapon: document.getElementById('weapon'),
      stamina: document.getElementById('stamina'),
      buffs: document.getElementById('buffs'),
      gameover: document.getElementById('gameover'),
      start: document.getElementById('start'),
      finalScore: document.getElementById('finalScore'),
      finalWave: document.getElementById('finalWave'),
      finalKills: document.getElementById('finalKills'),
      newHigh: document.getElementById('newHigh')
    };

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }
    function playTone(freq, duration, type = 'square', vol = 0.1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function sfxShuriken() { playTone(800, 0.08, 'square', 0.08); }
    function sfxKatana() { playTone(200, 0.15, 'sawtooth', 0.12); }
    function sfxGrenade() { playTone(80, 0.4, 'triangle', 0.2); }
    function sfxHit() { playTone(150, 0.1, 'square', 0.1); }
    function sfxDash() { playTone(400, 0.12, 'sine', 0.1); }
    function sfxPowerup() { playTone(600, 0.2, 'sine', 0.1); }

    const images = {};
    const imageList = ['village', 'ninja', 'zombie', 'shuriken', 'katana', 'grenade', 'kusarigama'];
    imageList.forEach(name => {
      images[name] = new Image();
      images[name].src = `assets/${name}.jpg`;
    });

    let keys = {};
    let mouse = { x: 450, y: 300 };
    let gameRunning = false;
    let shake = 0;

    const weapons = [
      { name: 'Shuriken', key: '1', type: 'ranged', damage: 28, cooldown: 10 },
      { name: 'Katana', key: '2', type: 'melee', damage: 50, cooldown: 25 },
      { name: 'Grenade', key: '3', type: 'aoe', damage: 40, cooldown: 60 },
      { name: 'Kusarigama', key: '4', type: 'chain', damage: 35, cooldown: 40 }
    ];
    let currentWeapon = 0;

    const player = {
      x: 450, y: 300,
      size: 20,
      speed: 3.4,
      baseSpeed: 3.4,
      health: 100,
      maxHealth: 100,
      score: 0,
      kills: 0,
      cooldown: 0,
      damageMult: 1,
      multiShot: 0,
      speedBuffTimer: 0,
      damageBuffTimer: 0,
      multiShotTimer: 0,
      stamina: 100,
      maxStamina: 100,
      dashCooldown: 0,
      dashTime: 0,
      dashVx: 0,
      dashVy: 0
    };

    let camera = { x: 0, y: 0 };
    let zombies = [];
    let projectiles = [];
    let particles = [];
    let powerups = [];
    let obstacles = [];
    let wave = 1;
    let zombiesToSpawn = 6;
    let spawnTimer = 0;
    let waveClearTimer = 0;
    let highScore = parseInt(localStorage.getItem('nvzHigh') || '0');

    ui.high.textContent = highScore;

    function generateObstacles() {
      obstacles = [];
      const count = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        let placed = false;
        for (let tries = 0; tries < 15 && !placed; tries++) {
          const w = 50 + Math.random() * 70;
          const h = 40 + Math.random() * 50;
          const x = 100 + Math.random() * (1200 - 200 - w);
          const y = 100 + Math.random() * (900 - 200 - h);
          if (Math.hypot(x + w/2 - 600, y + h/2 - 450) < 150) continue;
          obstacles.push({ x, y, w, h });
          placed = true;
        }
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key >= '1' && e.key <= '4') {
        currentWeapon = parseInt(e.key) - 1;
        ui.weapon.textContent = `Weapon: ${weapons[currentWeapon].name} (${e.key})`;
      }
      if (e.key === 'Shift' && gameRunning && player.dashCooldown <= 0 && player.stamina >= 30) {
        dash();
      }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left + camera.x;
      mouse.y = e.clientY - rect.top + camera.y;
    });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0 && player.cooldown <= 0 && gameRunning) {
        initAudio();
        attack();
      }
    });

    function startGame() {
      initAudio();
      ui.start.style.display = 'none';
      restart(true);
    }

    function collidesObstacle(x, y, r) {
      for (const o of obstacles) {
        const closestX = Math.max(o.x, Math.min(x, o.x + o.w));
        const closestY = Math.max(o.y, Math.min(y, o.y + o.h));
        if (Math.hypot(x - closestX, y - closestY) < r) return true;
      }
      return false;
    }

    function dash() {
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      player.dashVx = Math.cos(angle) * 12;
      player.dashVy = Math.sin(angle) * 12;
      player.dashTime = 8;
      player.dashCooldown = 45;
      player.stamina -= 30;
      sfxDash();
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: player.x, y: player.y,
          vx: -player.dashVx * 0.3 + (Math.random()-0.5)*2,
          vy: -player.dashVy * 0.3 + (Math.random()-0.5)*2,
          life: 12, color: '#3498db'
        });
      }
    }

    function attack() {
      const w = weapons[currentWeapon];
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      player.cooldown = w.cooldown;

      if (w.type === 'ranged') {
        sfxShuriken();
        const shots = 1 + (player.multiShot > 0 ? 1 : 0);
        const spread = shots > 1 ? 0.2 : 0;
        for (let s = 0; s < shots; s++) {
          const a = angle + (s - (shots-1)/2) * spread;
          projectiles.push({
            x: player.x, y: player.y,
            vx: Math.cos(a) * 10,
            vy: Math.sin(a) * 10,
            life: 50,
            size: 6,
            damage: Math.round(w.damage * player.damageMult),
            type: 'shuriken'
          });
        }
      } else if (w.type === 'melee') {
        sfxKatana();
        for (let z of zombies) {
          const dx = z.x - player.x, dy = z.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 70) {
            const zAngle = Math.atan2(dy, dx);
            let diff = Math.abs(angle - zAngle);
            if (diff > Math.PI) diff = 2 * Math.PI - diff;
            if (diff < 1.4) {
              damageZombie(z, Math.round(w.damage * player.damageMult));
            }
          }
        }
        for (let i = 0; i < 12; i++) {
          const a = angle + (i - 6) * 0.2;
          particles.push({
            x: player.x + Math.cos(a) * 40,
            y: player.y + Math.sin(a) * 40,
            vx: Math.cos(a) * 5,
            vy: Math.sin(a) * 5,
            life: 10, color: '#ecf0f1'
          });
        }
        shake = 8;
      } else if (w.type === 'aoe') {
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(angle) * 5,
          vy: Math.sin(angle) * 5,
          life: 40,
          size: 8,
          damage: Math.round(w.damage * player.damageMult),
          type: 'grenade',
          explodeAt: 25
        });
      } else if (w.type === 'chain') {
        sfxKatana();
        for (let z of zombies) {
          const dx = z.x - player.x, dy = z.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 120) {
            damageZombie(z, Math.round(w.damage * player.damageMult * (1 - dist/150)));
          }
        }
        particles.push({
          x: player.x, y: player.y,
          vx: Math.cos(angle) * 6,
          vy: Math.sin(angle) * 6,
          life: 15, color: '#bdc3c7'
        });
      }
    }

    function damageZombie(z, dmg) {
      z.health -= dmg;
      sfxHit();
      if (z.health <= 0) {
        player.score += 12 + wave * 3;
        player.kills++;
        if (Math.random() < 0.18) {
          const types = ['heal', 'speed', 'damage', 'multi'];
          const type = types[Math.floor(Math.random() * types.length)];
          powerups.push({
            x: z.x, y: z.y,
            type,
            life: 600,
            pulse: 0
          });
        }
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: z.x, y: z.y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 18, color: '#c0392b'
          });
        }
      }
    }

    function applyPowerup(type) {
      sfxPowerup();
      if (type === 'heal') {
        player.health = Math.min(player.maxHealth, player.health + 25);
        for (let i = 0; i < 6; i++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 15, color: '#2ecc71' });
      } else if (type === 'speed') {
        player.speedBuffTimer = 360;
      } else if (type === 'damage') {
        player.damageBuffTimer = 420;
      } else if (type === 'multi') {
        player.multiShotTimer = 300;
      }
    }

    function spawnZombie() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      const worldW = 1200, worldH = 900;
      if (side === 0) { x = Math.random() * worldW; y = -30; }
      else if (side === 1) { x = worldW + 30; y = Math.random() * worldH; }
      else if (side === 2) { x = Math.random() * worldW; y = worldH + 30; }
      else { x = -30; y = Math.random() * worldH; }

      const variant = Math.random();
      let size = 18, speed = 0.9, health = 40;
      if (variant > 0.75 && wave > 2) {
        size = 16; speed = 1.7 + wave * 0.08; health = 25;
      } else if (variant > 0.55 && wave > 3) {
        size = 24; speed = 0.6; health = 80 + wave * 10;
      }

      zombies.push({
        x, y, size, speed: speed + wave * 0.04,
        health, maxHealth: health
      });
    }

    function update() {
      if (!gameRunning) return;

      player.speed = player.baseSpeed * (player.speedBuffTimer > 0 ? 1.45 : 1);
      player.damageMult = player.damageBuffTimer > 0 ? 1.6 : 1;
      player.multiShot = player.multiShotTimer > 0 ? 1 : 0;
      if (player.speedBuffTimer > 0) player.speedBuffTimer--;
      if (player.damageBuffTimer > 0) player.damageBuffTimer--;
      if (player.multiShotTimer > 0) player.multiShotTimer--;
      if (player.dashCooldown > 0) player.dashCooldown--;
      if (player.stamina < player.maxStamina) player.stamina = Math.min(player.maxStamina, player.stamina + 0.3);

      if (player.dashTime > 0) {
        const nx = player.x + player.dashVx;
        const ny = player.y + player.dashVy;
        if (!collidesObstacle(nx, player.y, player.size)) player.x = nx;
        if (!collidesObstacle(player.x, ny, player.size)) player.y = ny;
        player.dashTime--;
      } else {
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;
        if (dx || dy) {
          const len = Math.hypot(dx, dy);
          const nx = player.x + (dx / len) * player.speed;
          const ny = player.y + (dy / len) * player.speed;
          if (!collidesObstacle(nx, player.y, player.size)) player.x = nx;
          if (!collidesObstacle(player.x, ny, player.size)) player.y = ny;
        }
      }
      player.x = Math.max(player.size + 4, Math.min(1200 - player.size - 4, player.x));
      player.y = Math.max(player.size + 4, Math.min(900 - player.size - 4, player.y));

      const targetCamX = player.x - canvas.width / 2;
      const targetCamY = player.y - canvas.height / 2;
      camera.x += (targetCamX - camera.x) * 0.08;
      camera.y += (targetCamY - camera.y) * 0.08;
      camera.x = Math.max(0, Math.min(1200 - canvas.width, camera.x));
      camera.y = Math.max(0, Math.min(900 - canvas.height, camera.y));

      if (player.cooldown > 0) player.cooldown--;

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.type === 'grenade' && p.life <= p.explodeAt) {
          sfxGrenade();
          for (let z of zombies) {
            if (Math.hypot(p.x - z.x, p.y - z.y) < 80) {
              damageZombie(z, p.damage);
            }
          }
          for (let j = 0; j < 15; j++) {
            particles.push({
              x: p.x, y: p.y,
              vx: (Math.random()-0.5)*8,
              vy: (Math.random()-0.5)*8,
              life: 20, color: '#e67e22'
            });
          }
          shake = 12;
          projectiles.splice(i, 1);
          continue;
        }
        if (p.life <= 0 || p.x < -20 || p.x > 1220 || p.y < -20 || p.y > 920 || collidesObstacle(p.x, p.y, p.size)) {
          projectiles.splice(i, 1); continue;
        }
        if (p.type !== 'grenade') {
          for (let j = zombies.length - 1; j >= 0; j--) {
            const z = zombies[j];
            if (Math.hypot(p.x - z.x, p.y - z.y) < z.size + p.size) {
              damageZombie(z, p.damage);
              projectiles.splice(i, 1);
              break;
            }
          }
        }
      }

      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const dx = player.x - z.x, dy = player.y - z.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const nx = z.x + (dx / dist) * z.speed;
          const ny = z.y + (dy / dist) * z.speed;
          if (!collidesObstacle(nx, z.y, z.size)) z.x = nx;
          if (!collidesObstacle(z.x, ny, z.size)) z.y = ny;
        }
        if (dist < player.size + z.size - 4) {
          player.health -= 0.35 + wave * 0.04;
          shake = Math.max(shake, 4);
          if (player.health <= 0) endGame();
        }
        if (z.health <= 0) zombies.splice(i, 1);
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.life--;
        p.pulse += 0.1;
        if (Math.hypot(p.x - player.x, p.y - player.y) < 24) {
          applyPowerup(p.type);
          powerups.splice(i, 1);
          continue;
        }
        if (p.life <= 0) powerups.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shake > 0) shake *= 0.85;

      spawnTimer++;
      if (zombies.length < zombiesToSpawn && spawnTimer > 35) {
        spawnZombie();
        spawnTimer = 0;
      }
      if (zombies.length === 0) {
        waveClearTimer++;
        if (waveClearTimer > 90) {
          wave++;
          zombiesToSpawn = Math.min(18, 5 + Math.floor(wave * 1.6));
          waveClearTimer = 0;
          player.health = Math.min(player.maxHealth, player.health + 8);
          generateObstacles();
        }
      } else {
        waveClearTimer = 0;
      }

      let buffText = [];
      if (player.speedBuffTimer > 0) buffText.push('SPEED');
      if (player.damageBuffTimer > 0) buffText.push('DMG');
      if (player.multiShotTimer > 0) buffText.push('MULTI');
      ui.buffs.textContent = buffText.length ? 'Buffs: ' + buffText.join(' • ') : '';

      ui.health.textContent = Math.max(0, Math.floor(player.health));
      ui.score.textContent = player.score;
      ui.wave.textContent = wave;
      ui.kills.textContent = player.kills;
      ui.stamina.textContent = 'Stamina: ' + Math.floor(player.stamina);
    }

    function draw() {
      ctx.save();
      if (shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      ctx.translate(-camera.x, -camera.y);

      if (images.village.complete) {
        ctx.drawImage(images.village, 0, 0, 1200, 900);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0, 0, 1200, 900);
      } else {
        ctx.fillStyle = '#151515';
        ctx.fillRect(0, 0, 1200, 900);
      }

      ctx.fillStyle = 'rgba(44, 62, 80, 0.7)';
      ctx.strokeStyle = '#34495e';
      ctx.lineWidth = 2;
      for (const o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }

      for (const p of powerups) {
        const pulse = 1 + Math.sin(p.pulse) * 0.15;
        let color = '#2ecc71';
        if (p.type === 'speed') color = '#3498db';
        if (p.type === 'damage') color = '#e74c3c';
        if (p.type === 'multi') color = '#9b59b6';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 18);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      for (const p of projectiles) {
        if (p.type === 'shuriken' && images.shuriken.complete) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(Date.now() / 100);
          ctx.drawImage(images.shuriken, -12, -12, 24, 24);
          ctx.restore();
        } else if (p.type === 'grenade' && images.grenade.complete) {
          ctx.drawImage(images.grenade, p.x - 10, p.y - 10, 20, 20);
        } else {
          ctx.fillStyle = '#f1c40f';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (const z of zombies) {
        if (images.zombie.complete) {
          ctx.drawImage(images.zombie, z.x - z.size, z.y - z.size, z.size * 2, z.size * 2);
        } else {
          ctx.fillStyle = '#27ae60';
          ctx.beginPath();
          ctx.arc(z.x, z.y, z.size, 0, Math.PI * 2);
          ctx.fill();
        }
        const barW = 28;
        ctx.fillStyle = '#000';
        ctx.fillRect(z.x - barW/2, z.y - z.size - 12, barW, 4);
        ctx.fillStyle = z.health > z.maxHealth * 0.4 ? '#e74c3c' : '#c0392b';
        ctx.fillRect(z.x - barW/2, z.y - z.size - 12, barW * (z.health / z.maxHealth), 4);
      }

      if (images.ninja.complete) {
        ctx.drawImage(images.ninja, player.x - player.size, player.y - player.size, player.size * 2, player.size * 2);
      } else {
        ctx.fillStyle = '#3498db';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();
      }
      if (gameRunning) {
        const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(angle) * 40, player.y + Math.sin(angle) * 40);
        ctx.stroke();
      }

      ctx.restore();
    }

    function endGame() {
      gameRunning = false;
      const isNew = player.score > highScore;
      if (isNew) {
        highScore = player.score;
        localStorage.setItem('nvzHigh', highScore);
        ui.high.textContent = highScore;
        ui.newHigh.style.display = 'block';
      } else {
        ui.newHigh.style.display = 'none';
      }
      ui.finalScore.textContent = player.score;
      ui.finalWave.textContent = wave;
      ui.finalKills.textContent = player.kills;
      ui.gameover.style.display = 'flex';
    }

    function restart(fromStart = false) {
      player.x = 600; player.y = 450;
      player.health = 100;
      player.score = 0;
      player.kills = 0;
      player.speedBuffTimer = 0;
      player.damageBuffTimer = 0;
      player.multiShotTimer = 0;
      player.stamina = 100;
      player.dashCooldown = 0;
      player.dashTime = 0;
      zombies = [];
      projectiles = [];
      particles = [];
      powerups = [];
      wave = 1;
      zombiesToSpawn = 6;
      spawnTimer = 0;
      waveClearTimer = 0;
      shake = 0;
      camera.x = 0; camera.y = 0;
      generateObstacles();
      gameRunning = true;
      ui.gameover.style.display = 'none';
      if (!fromStart) ui.start.style.display = 'none';
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
