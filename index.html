<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ninjas vs Zombies</title>
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #eee;
      overflow: hidden;
    }
    canvas {
      background: #151515;
      border: 2px solid #333;
      box-shadow: 0 0 50px rgba(0,0,0,0.7);
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000;
      font-weight: 500;
    }
    #ui div { margin-bottom: 6px; font-size: 18px; }
    #highscore { color: #f1c40f; }
    #buffs { color: #2ecc71; font-size: 14px; }
    #gameover {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.82);
      text-align: center;
    }
    #gameover h1 { color: #e74c3c; margin: 0 0 16px; font-size: 48px; }
    #gameover .stats { font-size: 20px; margin: 4px 0; }
    button {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 18px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #e74c3c; }
    #start {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.75);
      text-align: center;
    }
    #start h1 { color: #3498db; font-size: 42px; margin-bottom: 8px; }
    #start p { font-size: 18px; color: #aaa; margin: 4px 0; }
  </style>
</head>
<body>
  <canvas id="game" width="900" height="600"></canvas>
  <div id="ui">
    <div>Health: <span id="health">100</span></div>
    <div>Score: <span id="score">0</span></div>
    <div>Wave: <span id="wave">1</span></div>
    <div>Kills: <span id="kills">0</span></div>
    <div id="highscore">High: <span id="high">0</span></div>
    <div id="buffs"></div>
  </div>
  <div id="start">
    <h1>NINJAS VS ZOMBIES</h1>
    <p>WASD / Arrows to move</p>
    <p>Mouse to aim • Left Click to throw stars</p>
    <p>Space for melee slash</p>
    <p>Walk over glowing orbs for power-ups</p>
    <button onclick="startGame()">Start Run</button>
  </div>
  <div id="gameover">
    <h1>YOU DIED</h1>
    <div class="stats">Score: <span id="finalScore">0</span></div>
    <div class="stats">Wave: <span id="finalWave">1</span></div>
    <div class="stats">Kills: <span id="finalKills">0</span></div>
    <div class="stats" id="newHigh" style="color:#f1c40f;display:none;">New High Score!</div>
    <button onclick="restart()">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ui = {
      health: document.getElementById('health'),
      score: document.getElementById('score'),
      wave: document.getElementById('wave'),
      kills: document.getElementById('kills'),
      high: document.getElementById('high'),
      buffs: document.getElementById('buffs'),
      gameover: document.getElementById('gameover'),
      start: document.getElementById('start'),
      finalScore: document.getElementById('finalScore'),
      finalWave: document.getElementById('finalWave'),
      finalKills: document.getElementById('finalKills'),
      newHigh: document.getElementById('newHigh')
    };

    let keys = {};
    let mouse = { x: 450, y: 300 };
    let gameRunning = false;
    let shake = 0;

    const player = {
      x: 450, y: 300,
      size: 16,
      speed: 3.4,
      baseSpeed: 3.4,
      health: 100,
      maxHealth: 100,
      score: 0,
      kills: 0,
      color: '#3498db',
      cooldown: 0,
      meleeCooldown: 0,
      damageMult: 1,
      multiShot: 0,
      speedBuffTimer: 0,
      damageBuffTimer: 0,
      multiShotTimer: 0
    };

    let zombies = [];
    let projectiles = [];
    let particles = [];
    let powerups = [];
    let obstacles = [];
    let wave = 1;
    let zombiesToSpawn = 6;
    let spawnTimer = 0;
    let waveClearTimer = 0;
    let highScore = parseInt(localStorage.getItem('nvzHigh') || '0');

    ui.high.textContent = highScore;

    function generateObstacles() {
      obstacles = [];
      const count = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        let placed = false;
        for (let tries = 0; tries < 20 && !placed; tries++) {
          const w = 40 + Math.random() * 60;
          const h = 40 + Math.random() * 60;
          const x = 80 + Math.random() * (canvas.width - 160 - w);
          const y = 80 + Math.random() * (canvas.height - 160 - h);
          if (Math.hypot(x + w/2 - 450, y + h/2 - 300) < 100) continue;
          obstacles.push({ x, y, w, h });
          placed = true;
        }
      }
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0 && player.cooldown <= 0 && gameRunning) shoot();
    });
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && player.meleeCooldown <= 0 && gameRunning) melee();
    });

    function startGame() {
      ui.start.style.display = 'none';
      restart(true);
    }

    function collidesObstacle(x, y, r) {
      for (const o of obstacles) {
        const closestX = Math.max(o.x, Math.min(x, o.x + o.w));
        const closestY = Math.max(o.y, Math.min(y, o.y + o.h));
        if (Math.hypot(x - closestX, y - closestY) < r) return true;
      }
      return false;
    }

    function shoot() {
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      const shots = 1 + (player.multiShot > 0 ? 1 : 0);
      const spread = shots > 1 ? 0.15 : 0;
      for (let s = 0; s < shots; s++) {
        const a = angle + (s - (shots-1)/2) * spread;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(a) * 9,
          vy: Math.sin(a) * 9,
          life: 55,
          size: 4,
          damage: Math.round(28 * player.damageMult)
        });
      }
      player.cooldown = 10;
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: player.x, y: player.y,
          vx: Math.cos(angle) * (2 + Math.random() * 2),
          vy: Math.sin(angle) * (2 + Math.random() * 2),
          life: 8, color: '#f39c12'
        });
      }
    }

    function melee() {
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      let hitAny = false;
      for (let z of zombies) {
        const dx = z.x - player.x, dy = z.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 60) {
          const zAngle = Math.atan2(dy, dx);
          let diff = Math.abs(angle - zAngle);
          if (diff > Math.PI) diff = 2 * Math.PI - diff;
          if (diff < 1.3) {
            damageZombie(z, Math.round(45 * player.damageMult));
            hitAny = true;
          }
        }
      }
      if (hitAny) shake = 6;
      for (let i = 0; i < 10; i++) {
        const a = angle + (i - 5) * 0.25;
        particles.push({
          x: player.x + Math.cos(a) * 32,
          y: player.y + Math.sin(a) * 32,
          vx: Math.cos(a) * 4,
          vy: Math.sin(a) * 4,
          life: 12, color: '#ecf0f1'
        });
      }
      player.meleeCooldown = 28;
    }

    function damageZombie(z, dmg) {
      z.health -= dmg;
      if (z.health <= 0) {
        player.score += 12 + wave * 3;
        player.kills++;
        if (Math.random() < 0.18) {
          const types = ['heal', 'speed', 'damage', 'multi'];
          const type = types[Math.floor(Math.random() * types.length)];
          powerups.push({
            x: z.x, y: z.y,
            type,
            life: 600,
            pulse: 0
          });
        }
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: z.x, y: z.y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 18, color: '#c0392b'
          });
        }
      }
    }

    function applyPowerup(type) {
      if (type === 'heal') {
        player.health = Math.min(player.maxHealth, player.health + 25);
        for (let i = 0; i < 6; i++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 15, color: '#2ecc71' });
      } else if (type === 'speed') {
        player.speedBuffTimer = 360;
      } else if (type === 'damage') {
        player.damageBuffTimer = 420;
      } else if (type === 'multi') {
        player.multiShotTimer = 300;
      }
    }

    function spawnZombie() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * canvas.width; y = -30; }
      else if (side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
      else { x = -30; y = Math.random() * canvas.height; }

      const variant = Math.random();
      let size = 14, speed = 0.9, health = 35, color = '#27ae60';
      if (variant > 0.75 && wave > 2) {
        size = 12; speed = 1.6 + wave * 0.08; health = 22; color = '#2ecc71';
      } else if (variant > 0.55 && wave > 3) {
        size = 20; speed = 0.55; health = 70 + wave * 8; color = '#1e8449';
      }

      zombies.push({
        x, y, size, speed: speed + wave * 0.04,
        health, maxHealth: health, color
      });
    }

    function update() {
      if (!gameRunning) return;

      player.speed = player.baseSpeed * (player.speedBuffTimer > 0 ? 1.45 : 1);
      player.damageMult = player.damageBuffTimer > 0 ? 1.6 : 1;
      player.multiShot = player.multiShotTimer > 0 ? 1 : 0;
      if (player.speedBuffTimer > 0) player.speedBuffTimer--;
      if (player.damageBuffTimer > 0) player.damageBuffTimer--;
      if (player.multiShotTimer > 0) player.multiShotTimer--;

      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;
      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        const nx = player.x + (dx / len) * player.speed;
        const ny = player.y + (dy / len) * player.speed;
        if (!collidesObstacle(nx, player.y, player.size)) player.x = nx;
        if (!collidesObstacle(player.x, ny, player.size)) player.y = ny;
      }
      player.x = Math.max(player.size + 4, Math.min(canvas.width - player.size - 4, player.x));
      player.y = Math.max(player.size + 4, Math.min(canvas.height - player.size - 4, player.y));

      if (player.cooldown > 0) player.cooldown--;
      if (player.meleeCooldown > 0) player.meleeCooldown--;

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0 || p.x < -20 || p.x > canvas.width + 20 || p.y < -20 || p.y > canvas.height + 20 || collidesObstacle(p.x, p.y, p.size)) {
          projectiles.splice(i, 1); continue;
        }
        for (let j = zombies.length - 1; j >= 0; j--) {
          const z = zombies[j];
          if (Math.hypot(p.x - z.x, p.y - z.y) < z.size + p.size) {
            damageZombie(z, p.damage);
            projectiles.splice(i, 1);
            break;
          }
        }
      }

      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const dx = player.x - z.x, dy = player.y - z.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
          const nx = z.x + (dx / dist) * z.speed;
          const ny = z.y + (dy / dist) * z.speed;
          if (!collidesObstacle(nx, z.y, z.size)) z.x = nx;
          if (!collidesObstacle(z.x, ny, z.size)) z.y = ny;
        }
        if (dist < player.size + z.size - 2) {
          player.health -= 0.35 + wave * 0.04;
          shake = Math.max(shake, 4);
          if (player.health <= 0) endGame();
        }
        if (z.health <= 0) zombies.splice(i, 1);
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.life--;
        p.pulse += 0.1;
        if (Math.hypot(p.x - player.x, p.y - player.y) < 22) {
          applyPowerup(p.type);
          powerups.splice(i, 1);
          continue;
        }
        if (p.life <= 0) powerups.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shake > 0) shake *= 0.85;

      spawnTimer++;
      if (zombies.length < zombiesToSpawn && spawnTimer > 35) {
        spawnZombie();
        spawnTimer = 0;
      }
      if (zombies.length === 0) {
        waveClearTimer++;
        if (waveClearTimer > 90) {
          wave++;
          zombiesToSpawn = Math.min(18, 5 + Math.floor(wave * 1.6));
          waveClearTimer = 0;
          player.health = Math.min(player.maxHealth, player.health + 8);
          generateObstacles();
        }
      } else {
        waveClearTimer = 0;
      }

      let buffText = [];
      if (player.speedBuffTimer > 0) buffText.push('SPEED');
      if (player.damageBuffTimer > 0) buffText.push('DMG');
      if (player.multiShotTimer > 0) buffText.push('MULTI');
      ui.buffs.textContent = buffText.length ? 'Buffs: ' + buffText.join(' • ') : '';

      ui.health.textContent = Math.max(0, Math.floor(player.health));
      ui.score.textContent = player.score;
      ui.wave.textContent = wave;
      ui.kills.textContent = player.kills;
    }

    function draw() {
      ctx.save();
      if (shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      ctx.fillStyle = '#151515';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      ctx.fillStyle = '#2c3e50';
      ctx.strokeStyle = '#34495e';
      ctx.lineWidth = 2;
      for (const o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }

      for (const p of powerups) {
        const pulse = 1 + Math.sin(p.pulse) * 0.15;
        let color = '#2ecc71';
        if (p.type === 'speed') color = '#3498db';
        if (p.type === 'damage') color = '#e74c3c';
        if (p.type === 'multi') color = '#9b59b6';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 18);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#f1c40f';
      for (const p of projectiles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const z of zombies) {
        ctx.fillStyle = z.color;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.size, 0, Math.PI * 2);
        ctx.fill();
        const barW = 26;
        ctx.fillStyle = '#000';
        ctx.fillRect(z.x - barW/2, z.y - z.size - 10, barW, 4);
        ctx.fillStyle = z.health > z.maxHealth * 0.4 ? '#e74c3c' : '#c0392b';
        ctx.fillRect(z.x - barW/2, z.y - z.size - 10, barW * (z.health / z.maxHealth), 4);
      }

      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
      ctx.fill();
      if (gameRunning) {
        const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(angle) * 36, player.y + Math.sin(angle) * 36);
        ctx.stroke();
      }

      ctx.restore();
    }

    function endGame() {
      gameRunning = false;
      const isNew = player.score > highScore;
      if (isNew) {
        highScore = player.score;
        localStorage.setItem('nvzHigh', highScore);
        ui.high.textContent = highScore;
        ui.newHigh.style.display = 'block';
      } else {
        ui.newHigh.style.display = 'none';
      }
      ui.finalScore.textContent = player.score;
      ui.finalWave.textContent = wave;
      ui.finalKills.textContent = player.kills;
      ui.gameover.style.display = 'flex';
    }

    function restart(fromStart = false) {
      player.x = 450; player.y = 300;
      player.health = 100;
      player.score = 0;
      player.kills = 0;
      player.speedBuffTimer = 0;
      player.damageBuffTimer = 0;
      player.multiShotTimer = 0;
      zombies = [];
      projectiles = [];
      particles = [];
      powerups = [];
      wave = 1;
      zombiesToSpawn = 6;
      spawnTimer = 0;
      waveClearTimer = 0;
      shake = 0;
      generateObstacles();
      gameRunning = true;
      ui.gameover.style.display = 'none';
      if (!fromStart) ui.start.style.display = 'none';
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
